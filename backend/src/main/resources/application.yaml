spring:
  application:
    name: book_managerment

  datasource:
    url: jdbc:postgresql://localhost:5432/library_db
    username: postgres
    password: "1234"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false


